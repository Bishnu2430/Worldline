<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304">
<rect width="100%" height="100%" fill="white"/>
<text x="20.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Phobos and Deimos after 30 days against JPL, with and without Mars's lumpy (Tharsis) gravity</text>
<text x="20.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">how far each result is from what's expected, as a share of the limit it must stay within</text>
<line x1="250.0" y1="58" x2="250.0" y2="256" stroke="#e4e7eb"/>
<text x="250.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−6</tspan></text>
<line x1="318.6" y1="58" x2="318.6" y2="256" stroke="#e4e7eb"/>
<text x="318.6" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−5</tspan></text>
<line x1="387.1" y1="58" x2="387.1" y2="256" stroke="#e4e7eb"/>
<text x="387.1" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−4</tspan></text>
<line x1="455.7" y1="58" x2="455.7" y2="256" stroke="#e4e7eb"/>
<text x="455.7" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−3</tspan></text>
<line x1="524.3" y1="58" x2="524.3" y2="256" stroke="#e4e7eb"/>
<text x="524.3" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−2</tspan></text>
<line x1="592.9" y1="58" x2="592.9" y2="256" stroke="#e4e7eb"/>
<text x="592.9" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−1</tspan></text>
<line x1="661.4" y1="58" x2="661.4" y2="256" stroke="#e4e7eb"/>
<text x="661.4" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">1</text>
<line x1="730.0" y1="58" x2="730.0" y2="256" stroke="#e4e7eb"/>
<text x="730.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">10</text>
<line x1="661.4" y1="54" x2="661.4" y2="256" stroke="#c92a2a" stroke-width="2"/>
<text x="661.4" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="normal">limit</text>
<text x="20.0" y="78.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Phobos with the lumps: within its</text>
<text x="20.0" y="91.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">radius</text>
<rect x="250" y="68" width="270.9" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="98.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">0.10 km from JPL; radius 11.2 km</text>
<text x="20.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Deimos with the lumps: within its</text>
<text x="20.0" y="137.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">radius</text>
<rect x="250" y="114" width="319.1" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">0.28 km from JPL; radius 6.3 km</text>
<text x="20.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Phobos without them: farther than</text>
<text x="20.0" y="183.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">its radius</text>
<rect x="250" y="160" width="343.9" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="190.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">108 km from JPL; radius 11.2 km</text>
<text x="20.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Deimos without them: farther than</text>
<text x="20.0" y="229.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">its radius</text>
<rect x="250" y="206" width="312.4" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="236.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">175 km from JPL; radius 6.3 km</text>
<text x="250.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">share of the limit (logarithmic): under 1 passes</text>
</svg>
