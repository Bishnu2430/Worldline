<svg xmlns="http://www.w3.org/2000/svg" width="760" height="556" viewBox="0 0 760 556">
<rect width="100%" height="100%" fill="white"/>
<text x="20.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Two neutron stars' chirp: how fast the wave's frequency sweeps up, 20 to 40 Hz</text>
<line x1="90.8" y1="64" x2="90.8" y2="400" stroke="#e4e7eb"/>
<text x="90.8" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">20</text>
<line x1="250.6" y1="64" x2="250.6" y2="400" stroke="#e4e7eb"/>
<text x="250.6" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">25</text>
<line x1="410.4" y1="64" x2="410.4" y2="400" stroke="#e4e7eb"/>
<text x="410.4" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">30</text>
<line x1="570.2" y1="64" x2="570.2" y2="400" stroke="#e4e7eb"/>
<text x="570.2" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">35</text>
<line x1="730.0" y1="64" x2="730.0" y2="400" stroke="#e4e7eb"/>
<text x="730.0" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">40</text>
<line x1="90" y1="356.8" x2="730" y2="356.8" stroke="#e4e7eb"/>
<text x="84.0" y="360.8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="end" font-weight="normal">0.96</text>
<line x1="90" y1="287.5" x2="730" y2="287.5" stroke="#e4e7eb"/>
<text x="84.0" y="291.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="end" font-weight="normal">0.97</text>
<line x1="90" y1="218.1" x2="730" y2="218.1" stroke="#e4e7eb"/>
<text x="84.0" y="222.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="end" font-weight="normal">0.98</text>
<line x1="90" y1="148.7" x2="730" y2="148.7" stroke="#e4e7eb"/>
<text x="84.0" y="152.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="end" font-weight="normal">0.99</text>
<line x1="90" y1="79.3" x2="730" y2="79.3" stroke="#e4e7eb"/>
<text x="84.0" y="83.3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="end" font-weight="normal">1</text>
<rect x="90" y="64" width="640" height="336" fill="none" stroke="#6b7785"/>
<text x="410.0" y="436.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">wave frequency (Hz)</text>
<text x="18" y="232.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" transform="rotate(-90 18 232.0)">df/dt, over the chirp formula's</text>
<circle cx="90.0" cy="273.5" r="2.6" fill="#1c7ed6"/>
<circle cx="164.4" cy="289.2" r="2.6" fill="#1c7ed6"/>
<circle cx="267.3" cy="310.0" r="2.6" fill="#1c7ed6"/>
<circle cx="421.8" cy="339.3" r="2.6" fill="#1c7ed6"/>
<circle cx="688.7" cy="384.7" r="2.6" fill="#1c7ed6"/>
<circle cx="100" cy="452" r="3" fill="#1c7ed6"/>
<text x="118.0" y="456.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">simulated, from the wave's zero crossings</text>
<path d="M90.8,79.3 L730.0,79.3" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="90" y1="468" x2="110" y2="468" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="118.0" y="472.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">the chirp formula (96/5) π^(8/3) (G𝓜/c³)^(5/3) f^(11/3)</text>
<path d="M90.8,257.7 L106.8,260.6 L122.7,263.6 L138.7,266.5 L154.7,269.4 L170.7,272.2 L186.7,275.1 L202.6,277.9 L218.6,280.7 L234.6,283.5 L250.6,286.3 L266.6,289.0 L282.5,291.8 L298.5,294.5 L314.5,297.2 L330.5,299.9 L346.5,302.5 L362.4,305.2 L378.4,307.8 L394.4,310.4 L410.4,313.0 L426.4,315.6 L442.3,318.2 L458.3,320.8 L474.3,323.3 L490.3,325.9 L506.3,328.4 L522.3,330.9 L538.2,333.4 L554.2,335.9 L570.2,338.3 L586.2,340.8 L602.2,343.3 L618.1,345.7 L634.1,348.1 L650.1,350.5 L666.1,352.9 L682.1,355.3 L698.0,357.7 L714.0,360.1 L730.0,362.5" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="90" y1="484" x2="110" y2="484" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="118.0" y="488.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">with its first correction, −(743/336 + 11ν/4) x</text>
<path d="M90.8,184.8 L106.8,185.9 L122.7,187.1 L138.7,188.2 L154.7,189.2 L170.7,190.3 L186.7,191.3 L202.6,192.3 L218.6,193.3 L234.6,194.3 L250.6,195.2 L266.6,196.1 L282.5,197.0 L298.5,197.9 L314.5,198.8 L330.5,199.7 L346.5,200.5 L362.4,201.3 L378.4,202.2 L394.4,203.0 L410.4,203.7 L426.4,204.5 L442.3,205.3 L458.3,206.0 L474.3,206.7 L490.3,207.4 L506.3,208.1 L522.3,208.8 L538.2,209.5 L554.2,210.2 L570.2,210.8 L586.2,211.5 L602.2,212.1 L618.1,212.7 L634.1,213.3 L650.1,213.9 L666.1,214.5 L682.1,215.1 L698.0,215.6 L714.0,216.2 L730.0,216.7" fill="none" stroke="#9c36b5" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="90" y1="500" x2="110" y2="500" stroke="#9c36b5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="118.0" y="504.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">general relativity with the tail, +4π x^(3/2), which local equations leave out</text>
<text x="20.0" y="524.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">3927 wave cycles. The sweep runs slower than the leading formula by its next order, about 3 x, where x =</text>
<text x="20.0" y="540.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">(πGmf/c³)^(2/3) ≈ GM/rc²; with the correction, what's left is of second order, x², as it must be.</text>
</svg>
