<line x1="90" y1="468" x2="110" y2="468" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="118.0" y="472.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Chandrasekhar's limit, 1.4563 Suns</text>
<text x="20.0" y="492.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">The limit is 1.4563 Suns, the roadmap's 1.46 to its digits. The shortfall falls as x^−1.19, then x^−1.89, then</text>
<text x="20.0" y="508.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">x^−2.00 as the electrons grow relativistic: as 1/x², faster than 1/x, the test's midpoint.</text>
