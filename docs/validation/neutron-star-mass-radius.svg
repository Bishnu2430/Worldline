<text x="20.0" y="492.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">At most 2.048 Suns, at 9.98 km; a 1.4-Sun star is 11.71 km. Above the heaviest, no static star exists: it</text>
