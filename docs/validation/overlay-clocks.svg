<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304">
<rect width="100%" height="100%" fill="white"/>
<text x="20.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">The clock overlay's rates, against hand calculations</text>
<text x="20.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">how far each result is from what's expected, as a share of the limit it must stay within</text>
<line x1="250.0" y1="58" x2="250.0" y2="256" stroke="#e4e7eb"/>
<text x="250.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−6</tspan></text>
<line x1="318.6" y1="58" x2="318.6" y2="256" stroke="#e4e7eb"/>
<text x="318.6" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−5</tspan></text>
<line x1="387.1" y1="58" x2="387.1" y2="256" stroke="#e4e7eb"/>
<text x="387.1" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−4</tspan></text>
<line x1="455.7" y1="58" x2="455.7" y2="256" stroke="#e4e7eb"/>
<text x="455.7" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−3</tspan></text>
<line x1="524.3" y1="58" x2="524.3" y2="256" stroke="#e4e7eb"/>
<text x="524.3" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−2</tspan></text>
<line x1="592.9" y1="58" x2="592.9" y2="256" stroke="#e4e7eb"/>
<text x="592.9" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle">10<tspan dy="-5" font-size="8">−1</tspan></text>
<line x1="661.4" y1="58" x2="661.4" y2="256" stroke="#e4e7eb"/>
<text x="661.4" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">1</text>
<line x1="730.0" y1="58" x2="730.0" y2="256" stroke="#e4e7eb"/>
<text x="730.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">10</text>
<line x1="661.4" y1="54" x2="661.4" y2="256" stroke="#c92a2a" stroke-width="2"/>
<text x="661.4" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="normal">limit</text>
<text x="20.0" y="78.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">GPS clocks' gain from gravity,</text>
<text x="20.0" y="91.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">GM/c²(1/R − 1/r)</text>
<rect x="250" y="68" width="388.0" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="98.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">45.65 µs a day (limit the next order, (GM/Rc²)²)</text>
<text x="20.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">on Earth, with the Sun</text>
<rect x="250" y="114" width="325.5" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">slow by 1.0566e-8, 0.913 ms a day</text>
<text x="20.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">at 2 r_s from a black hole: √½</text>
<rect x="250" y="160" width="346.0" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="190.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">0.7071067812</text>
<text x="20.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">above a spinning hole's pole at 1.9</text>
<text x="20.0" y="229.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">GM/c², Kerr's g_tt</text>
<rect x="250" y="206" width="160.9" height="14" fill="#2f9e44" rx="2"/>
<text x="250.0" y="236.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">0.3745283610</text>
<text x="250.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7785" text-anchor="start" font-weight="normal">share of the limit (logarithmic): under 1 passes</text>
</svg>
